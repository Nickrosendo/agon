name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Tests, before SDL is installed, since they must not need it
        run: make test CC=${{ matrix.cc }}
      - name: Install SDL, for the window program only
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: The window program, on SDL's dummy video driver
        run: make test-window CC=${{ matrix.cc }}
      - name: Optimised build
        run: make release CC=${{ matrix.cc }} && make window MODE=release CC=${{ matrix.cc }}
      - name: The program runs
        run: ./build/release/agon --once --seed 1 --ticks 200 --save world.save && ./build/release/agon --once --load world.save --ticks 0

  windows:
    runs-on: windows-latest
    # The MSYS2 shell, with its own gcc and SDL: "shell: msys2 {0}" runs each
    # step's commands there instead of in PowerShell.
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
      - name: Tests
        run: make test PLATFORM=windows
      - name: The window program, on SDL's dummy video driver
        run: make test-window PLATFORM=windows
      - name: Optimised build
        run: make window MODE=release PLATFORM=windows
      - name: Package it with every DLL it needs from MSYS2
        run: |
          mkdir agon-window
          cp build/release/agon-window.exe agon-window/
          ldd build/release/agon-window.exe | awk '/mingw64/ {print $3}' | xargs -I{} cp {} agon-window/
          ls agon-window
          test -f agon-window/SDL2.dll
          zip -r agon-window-windows.zip agon-window
      - name: The packaged program runs by itself
        run: |
          cd agon-window
          SDL_VIDEODRIVER=dummy ./agon-window.exe --seed 3 --size 64x32 --frames 50 --checksum
      - uses: actions/upload-artifact@v4
        with:
          name: agon-window-windows
          path: agon-window-windows.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: The browser page
        run: make web
      - name: Under 2 MB compressed
        run: test "$(cat build/web/* | gzip -c | wc -c)" -lt 2000000
      - uses: actions/upload-artifact@v4
        with:
          name: agon-web
          path: build/web

  # The browser page, on every push to main that passes. Pages serves it at
  # https://nickrosendo.github.io/agon/.
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, windows, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agon-web
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # A version tag that passes becomes a release, with the Windows program attached.
  # The tag's own message is the release notes.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agon-window-windows
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # This job has no checkout, so the tag's message comes from the API.
          # tail skips its subject line and the blank line after it.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .message | tail -n +3 > notes.txt
          gh release create "$TAG" agon-window-windows.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file notes.txt \
            --title "agon ${TAG#v}"
