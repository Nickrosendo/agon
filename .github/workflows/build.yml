name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Tests, before SDL is installed, since they must not need it
        run: make test CC=${{ matrix.cc }}
      - name: Install SDL, for the window program only
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: The window program, on SDL's dummy video driver
        run: make test-window CC=${{ matrix.cc }}
      - name: Optimised build
        run: make release CC=${{ matrix.cc }} && make window MODE=release CC=${{ matrix.cc }}
      - name: The program runs
        run: ./build/release/agon --once --seed 1 --ticks 200 --save world.save && ./build/release/agon --once --load world.save --ticks 0
