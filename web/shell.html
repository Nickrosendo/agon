<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agon</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #999; font: 13px monospace; }
  body { display: flex; flex-direction: column; }
  /* SDL follows this size: the canvas holds as many pixels as it shows. */
  canvas { display: block; flex: 1; min-height: 0; width: 100%; outline: none; }
  p { margin: 0; padding: 4px 8px; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<p id="note">agon runs only in this tab: refreshing the page loses the world.</p>
<script>
  // The page address chooses the world: ?seed=3 a new world from that seed,
  // ?code=agon1:... a world someone shared (the c key copies such a link),
  // replayed to where it was copied. The C program reads them as ordinary
  // --seed and --code options, and with neither it takes a seed from the clock.
  // A code goes in whole: the C side checks it and says what is wrong with it.
  var fields = new URLSearchParams(location.search);
  var seed = fields.get("seed");
  var code = fields.get("code");
  var args = [];
  if (code) {
    args = ["--code", code];
  } else if (seed && /^(0x[0-9a-f]+|[0-9]+)$/i.test(seed)) {
    args = ["--seed", seed];
  }
  var Module = {
    canvas: document.getElementById("canvas"),
    arguments: args,
    onAbort: function (reason) {
      document.getElementById("note").textContent =
        "agon stopped: " + reason + ". Refreshing starts a new world.";
    },
  };
  // Keys go to the world, not to the page, as soon as it is on screen.
  Module.canvas.focus();
</script>
{{{ SCRIPT }}}
</body>
</html>
